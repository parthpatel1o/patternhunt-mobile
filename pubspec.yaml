name: patternhunt_mobile
description: PatternHunt mobile app for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  dio: ^5.9.0
  supabase_flutter: ^2.10.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2
  image_picker: ^1.2.0
  image_cropper: ^12.2.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  file_picker: ^8.3.7
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/constants.json
    - assets/design-tokens.json
    - assets/logo.png
